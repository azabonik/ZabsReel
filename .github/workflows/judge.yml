name: Judge

# The judge (judge/: black-box tests for the rewrite) against this build through
# the v0.2.0 adapter. JUDGE.lock covers this file, so a change to how CI runs
# the judge is a lock change (judge/README.md, "Threat model"). ci.yml runs the
# lock gate on the checkout too, so deleting this file fails ci.yml.
#
# The judge runs from a copy made before any code from the change under test
# runs (npm ci, the Electron install and the build all do), and the copy is
# checked by its own copied gate before the install and again after the build.
#
# No code from the change runs as the runner's user (which has passwordless
# sudo), except the lock-covered judge files (judge/, the gate and this file),
# which come from the pull request's checkout and which the gauntlet reviews.
# The install, the build and the editor under test run as zjudge, a user made
# here before any of it: no sudo, no group shared with the runner's user, no
# cron or at jobs, umask 022, its own home and npm cache; the checkout keeps
# no token (persist-credentials: false) and its .git is closed to it.
# judge/lockout.py proves, before the build
# and again just before the judge, that zjudge cannot change the judge's copy,
# its own step's file-command files (a write bit for others there fails the
# step: the runner makes the later steps' files there with the same umask), the
# Node toolchain, the folders on PATH, the runner's home, the workspace or the
# judge's scratch folder (after it takes the write bit for others away where it
# is set), and ends every process zjudge left. Workflow commands are off while
# zjudge's output is printed. run.py --as-user zjudge runs the adapter and the
# editor as zjudge under an strace that runs as root, and ends every zjudge
# process after each test. The runner's FFmpeg still reads the files the editor
# wrote, with the runner's rights (judge/README.md, "Threat model").
#
# On a pull request the base branch's gate also checks the pull request's
# files, and every lock-covered path that differs from the base is listed in
# the job summary and in one warning. This catches a weakened gate only when
# the pull request leaves this file unchanged: on pull_request events GitHub
# runs the pull request's own copy of this workflow, so a pull request that
# also edits it can remove that step (its diff then shows this file and
# JUDGE.lock changed). Enforcing it needs GitHub settings (a required check
# from a workflow the pull request cannot change, or a required review): an
# open decision for Anthony (judge/README.md, "Threat model").

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  judge:
    runs-on: ubuntu-latest
    steps:
      # No token is kept in the checkout (persist-credentials: false): nothing
      # after this step needs it (the base gate's fetch reads the public
      # repository).
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # First, before anything from the checkout runs: judge/, the gate and this
      # workflow, in the layout the gate expects, read-only.
      - name: Copy the judge out of the checkout
        run: |
          J="$RUNNER_TEMP/judge-src"
          mkdir -p "$J/scripts" "$J/.github/workflows"
          cp -R judge "$J/judge"
          cp scripts/check-judge-lock.mjs "$J/scripts/"
          cp .github/workflows/judge.yml "$J/.github/workflows/"
          chmod -R a-w "$J"

      # No npm cache: the install runs as zjudge, with a cache of its own in its
      # home (nothing it writes is saved for other runs).
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Pull requests only, before anything from the checkout runs. The lock's
      # content comes from the pull request (a reviewed judge change updates
      # it); the base branch's gate, run from $RUNNER_TEMP with --root on the
      # checkout, fails a pull request that weakens the gate, as long as the
      # pull request does not also change this step (this workflow comes from
      # the pull request). A base without the gate (the pull request that adds
      # it) is skipped with a notice.
      - name: Base branch's judge lock gate on the pull request
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "refs/heads/$BASE_REF"
          list="$RUNNER_TEMP/judge-paths-changed.txt"
          git diff --name-only FETCH_HEAD HEAD -- judge scripts/check-judge-lock.mjs .github/workflows/judge.yml > "$list"
          {
            echo "### Lock-covered paths that differ from $BASE_REF"
            if [ -s "$list" ]; then sed 's/^/- `/; s/$/`/' "$list"; else echo "None."; fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -s "$list" ]; then
            echo "::warning title=Judge files changed::lock-covered paths that differ from $BASE_REF: $(paste -sd ' ' "$list")"
          fi
          if ! git cat-file -e FETCH_HEAD:scripts/check-judge-lock.mjs 2>/dev/null; then
            echo "::notice title=No base gate::$BASE_REF has no scripts/check-judge-lock.mjs; the base gate step is skipped"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/base-gate"
          git show FETCH_HEAD:scripts/check-judge-lock.mjs > "$RUNNER_TEMP/base-gate/check-judge-lock.mjs"
          node "$RUNNER_TEMP/base-gate/check-judge-lock.mjs" --root "$GITHUB_WORKSPACE"

      # The checkout's .git (it holds no token: persist-credentials: false) is
      # closed to every other user before the build user exists, as a second
      # wall; nothing after this step runs git, and the build user's copy leaves
      # .git out.
      - name: Close the checkout's .git to other users
        run: chmod -R go-rwx "$GITHUB_WORKSPACE/.git"

      # The copied gate on the copy (its self-test works on temp copies). The
      # step output pins the copy's lock and gate for the check after the build.
      - name: Judge lock gate on the copy (before the install)
        id: pin
        run: |
          J="$RUNNER_TEMP/judge-src"
          node "$J/scripts/check-judge-lock.mjs" --self-test
          node "$J/scripts/check-judge-lock.mjs"
          echo "sum=$(cat "$J/judge/JUDGE.lock" "$J/scripts/check-judge-lock.mjs" | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      # strace: every test that starts the editor runs its adapter under
      # strace (the download tripwire, and test_network_hosts' file-system
      # trace). strace starts the adapter as its own child, which
      # kernel.yama.ptrace_scope 1 allows.
      - name: Install FFmpeg and strace
        run: sudo apt-get update && sudo apt-get install -y ffmpeg strace

      # The graphics add-on the judge gives the editor (judge/README.md, "The
      # graphics add-on"), before any code from the change runs and before the
      # build user exists: the judge copy's install.sh, as the runner's user,
      # into /srv/judge/addon. Remotion's packages come from the judge's own
      # lock (npm ci --ignore-scripts: every tarball is checked against its
      # sha512, and no package script runs), and the Chrome for Testing
      # headless shell from the judge's pin (size and sha256 checked before it
      # is unpacked). The folder ends read-only for everyone; lockout.py then
      # proves zjudge can change none of it (it is under /srv/judge). Nothing
      # is downloaded during a test.
      - name: Install the graphics add-on for the judge
        run: |
          sudo install -d -o "$(id -u)" -g "$(id -g)" -m 0755 /srv/judge
          bash "$RUNNER_TEMP/judge-src/judge/fixtures/graphics-addon/install.sh" /srv/judge/addon

      # The build user, before any code from the change runs: zjudge, no sudo,
      # only its own group, and no cron or at jobs (cron.deny, at.deny; an
      # allow file would make them ignored). /srv/judge (the runner's, mode 0755)
      # holds the judge's scratch folders, where zjudge can enter but not write,
      # and already holds the add-on (installed above; install -d leaves it as
      # it is and only sets /srv/judge's own owner and mode again).
      # lockout.py then takes away the write bit for others where it is set
      # (chmod o-w) on the judge's copy, this step's file-command files
      # ($GITHUB_ENV, $GITHUB_PATH, $GITHUB_OUTPUT, $GITHUB_STEP_SUMMARY), the
      # Node toolchain, every folder on PATH (or the nearest folder above one that
      # is not there), the runner's home, the workspace and /srv/judge, and as
      # zjudge tries to change each file and folder there and each folder above
      # them: one attempt that is not refused fails the step. The runner makes
      # new file-command files for each later step in the same folder with its
      # own umask, so there a write bit for others fails the step
      # (--fail-if-writable) instead of being taken away.
      - name: Create the build user and lock it out
        run: |
          sudo useradd --create-home --user-group --shell /bin/bash zjudge
          if [ "$(id -Gn zjudge)" != zjudge ]; then
            echo "zjudge is in other groups: $(id -Gn zjudge)" >&2
            exit 1
          fi
          if [ -e /etc/cron.allow ] || [ -e /etc/at.allow ]; then
            echo "/etc/cron.allow or /etc/at.allow is there: cron.deny and at.deny would be ignored" >&2
            exit 1
          fi
          echo zjudge | sudo tee -a /etc/cron.deny /etc/at.deny > /dev/null
          sudo install -d -o "$(id -u)" -g "$(id -g)" -m 0755 /srv/judge
          IFS=: read -r -a path_dirs <<< "$PATH"
          python3 -I -B "$RUNNER_TEMP/judge-src/judge/lockout.py" --user zjudge \
            --fail-if-writable "$(dirname "$GITHUB_ENV")" \
            "$RUNNER_TEMP/judge-src" "$(dirname "$GITHUB_ENV")" "$GITHUB_ENV" "$GITHUB_PATH" "$GITHUB_OUTPUT" \
            "$GITHUB_STEP_SUMMARY" "$(dirname "$(dirname "$(command -v node)")")" "${path_dirs[@]}" "$HOME" \
            "$GITHUB_WORKSPACE" /srv/judge

      # The runner's own tests (crash, hang, early exit, wrong check counts, a
      # leaked process, forged results, SIGTERM, the not applicable and not
      # observed statuses, the download tripwire on a fixture adapter that
      # addresses another computer), the --as-user cases with zjudge (the
      # fixture adapter cannot change the judge or reach strace or the test
      # process, what it leaves running is ended by the user sweep, lockout.py
      # finds a world-writable file), and the adapter's and check_observe.py's
      # self-tests. No editor starts, so it runs before the install.
      # --require-trace: the tripwire cases must run here, so a runner where
      # strace cannot trace a child fails this step.
      - name: Judge runner self-test
        run: timeout -k 30 1200 python3 -I "$RUNNER_TEMP/judge-src/judge/run.py" --self-test --require-trace --as-user zjudge --scratch /srv/judge/selftest

      # The checkout without .git and judge/, in a folder of zjudge's: the
      # install and the build write only there.
      # Every step whose output comes from zjudge or the editor turns workflow
      # commands off around it with the judge copy's ci/quiet.sh:
      # ::stop-commands:: with a token made in that script's shell (never in a
      # command line or the environment, so zjudge cannot read it), and the
      # token turns them on again, also when the command fails. zjudge's output
      # goes to a file of the runner's (mode 0600) that is printed after the
      # command ends, so no zjudge process holds the step's own output, sees
      # the token, or keeps the step open. The self-test runs ci/quiet.sh on a
      # command that prints a workflow command.
      - name: Copy the checkout for the build user
        run: |
          sudo -n -u zjudge -- mkdir -m 0755 /home/zjudge/build
          bash "$RUNNER_TEMP/judge-src/judge/ci/quiet.sh" "$RUNNER_TEMP/zjudge-step.log" bash -c '
            set -o pipefail
            tar -C "$GITHUB_WORKSPACE" --exclude=./.git --exclude=./judge -cf - . \
              | sudo -n -u zjudge -- tar -C /home/zjudge/build -xf -'

      # The install and the build as zjudge, with an environment of their own
      # (env -i): the toolchain's node and npm first on PATH, zjudge's home and
      # npm cache, umask 022 (the judge reads what they make).
      - name: Install dependencies (as zjudge)
        run: |
          bash "$RUNNER_TEMP/judge-src/judge/ci/quiet.sh" "$RUNNER_TEMP/zjudge-step.log" \
            sudo -n -u zjudge -H -- env -i PATH="$(dirname "$(command -v node)"):/usr/local/bin:/usr/bin:/bin" \
            HOME=/home/zjudge npm_config_cache=/home/zjudge/.npm LANG=C.UTF-8 CI=true \
            sh -c 'umask 022 && cd /home/zjudge/build && npm ci'

      # As in ci.yml: npm ci leaves Electron's binary out; install.js fetches
      # it (checked against the package's checksums.json).
      - name: Install the Electron binary (as zjudge)
        run: |
          bash "$RUNNER_TEMP/judge-src/judge/ci/quiet.sh" "$RUNNER_TEMP/zjudge-step.log" \
            sudo -n -u zjudge -H -- env -i PATH="$(dirname "$(command -v node)"):/usr/local/bin:/usr/bin:/bin" \
            HOME=/home/zjudge npm_config_cache=/home/zjudge/.npm LANG=C.UTF-8 CI=true \
            sh -c 'umask 022 && cd /home/zjudge/build && node node_modules/electron/install.js'

      - name: Build (as zjudge)
        run: |
          bash "$RUNNER_TEMP/judge-src/judge/ci/quiet.sh" "$RUNNER_TEMP/zjudge-step.log" \
            sudo -n -u zjudge -H -- env -i PATH="$(dirname "$(command -v node)"):/usr/local/bin:/usr/bin:/bin" \
            HOME=/home/zjudge npm_config_cache=/home/zjudge/.npm LANG=C.UTF-8 CI=true \
            sh -c 'umask 022 && cd /home/zjudge/build && npm run build'

      # Just before the judge: every process the build left as zjudge is ended
      # (--kill), and the same paths are tried again as zjudge.
      - name: Lock the build user out (after the build)
        run: |
          IFS=: read -r -a path_dirs <<< "$PATH"
          python3 -I -B "$RUNNER_TEMP/judge-src/judge/lockout.py" --user zjudge --kill \
            --fail-if-writable "$(dirname "$GITHUB_ENV")" \
            "$RUNNER_TEMP/judge-src" "$(dirname "$GITHUB_ENV")" "$GITHUB_ENV" "$GITHUB_PATH" "$GITHUB_OUTPUT" \
            "$GITHUB_STEP_SUMMARY" "$(dirname "$(dirname "$(command -v node)")")" "${path_dirs[@]}" "$HOME" \
            "$GITHUB_WORKSPACE" /srv/judge

      # The install and the build ran code from the change under test: the
      # copy's lock and gate must be the bytes pinned before them, and the copy
      # must still match its lock.
      - name: Judge lock gate on the copy (after the build)
        env:
          PINNED: ${{ steps.pin.outputs.sum }}
        run: |
          J="$RUNNER_TEMP/judge-src"
          now="$(cat "$J/judge/JUDGE.lock" "$J/scripts/check-judge-lock.mjs" | sha256sum | cut -d' ' -f1)"
          if [ -z "$PINNED" ] || [ "$now" != "$PINNED" ]; then
            echo "the copy's JUDGE.lock or gate changed during the install or the build" >&2
            exit 1
          fi
          node "$J/scripts/check-judge-lock.mjs"

      # The editor's built-in graphics renderer (its own Electron) runs only in
      # Chromium's namespace sandbox, which needs unprivileged user namespaces;
      # Ubuntu 24.04 restricts them through AppArmor (ci.yml's motion steps
      # lift the same restriction). The judge's graphics checks on the
      # built-in renderer need it to run, so it is lifted here, for every
      # user, zjudge included (judge/README.md, "Threat model").
      # A known gap, accepted while the judge grades v0.2.0: zjudge can
      # create user namespaces too. Before the first graded rewrite build the
      # judge installs a root-owned, checksum-pinned renderer binary with an
      # AppArmor profile that alone may create user namespaces, the editor is
      # pointed at it (a spec requirement), this step goes, and CI proves
      # that zjudge cannot run `unshare -U`.
      - name: Allow unprivileged user namespaces (the built-in graphics renderer's sandbox)
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      # The judge from the copy against zjudge's build, through the v0.2.0
      # adapter (its MCP server over stdio, a scratch home and data folder, a
      # free port), measured with the runner's FFmpeg (apt, on PATH). The
      # graphics tests get the add-on installed above (--graphics-addon).
      # --as-user zjudge: the adapter, the editor and what they start run as
      # zjudge, under an strace that runs as root; after each test every zjudge
      # process is ended.
      # Media made with lavfi, nothing downloaded: the adapter starts the
      # editor so that it fetches nothing, and every test's "nothing was
      # downloaded" check fails on any connection to another computer.
      # --require-trace: a check that needs strace fails without it (never
      # "not observed"). --release zedmix: the build is graded as the current
      # release (test_cli_migrate holds it to ZedMix's names), whatever it
      # installs. --strict: while the judge grades v0.2.0, whose file
      # format every crafted input is made from, a check recorded as not
      # applicable fails. timeout -k ends a hang as a failure; the runner also
      # times out each test. The check details quote what the editor said, so
      # workflow commands are off while it runs (ci/quiet.sh --live: the runner
      # prints as it goes; no zjudge process holds the step's output, and the
      # token is made before any zjudge process starts and is never passed on).
      - name: Judge (v0.2.0 adapter, as zjudge)
        run: |
          bash "$RUNNER_TEMP/judge-src/judge/ci/quiet.sh" --live timeout -k 30 2400 \
            python3 -I "$RUNNER_TEMP/judge-src/judge/run.py" --build /home/zjudge/build \
            --scratch /srv/judge/scratch --strict --require-trace --as-user zjudge \
            --graphics-addon /srv/judge/addon --release zedmix

      # A failed run keeps its scratch folder, which holds files and folders of
      # zjudge's, links among them (the editor's sandbox is zjudge's own folder,
      # so the kernel's link protection does not apply there). First every
      # zjudge process and its crontab are ended (lockout.py --kill: by real and
      # by effective user id, and none may be left), so nothing changes them
      # after that. Then root runs the judge copy's ci/collect_logs.sh: it
      # copies only the regular files named *.log or *.stderr (find does not
      # follow links, and -type f leaves out links, FIFOs and devices) into a
      # new folder of the runner's, which is all the upload sees: a link the
      # editor planted to a file of the runner's (the checkout's .git,
      # /proc/self/environ) or to a folder never reaches it. The self-test runs
      # it on a tree with such a link and a FIFO.
      - name: Collect the judge's logs
        if: failure()
        run: |
          python3 -I -B "$RUNNER_TEMP/judge-src/judge/lockout.py" --user zjudge --kill
          sudo -n bash "$RUNNER_TEMP/judge-src/judge/ci/collect_logs.sh" "$(id -u):$(id -g)" \
            "$RUNNER_TEMP/judge-logs" /srv/judge/scratch /srv/judge/selftest

      # The logs (records/<test>.log, records/<test>.adapter-strace.log,
      # adapter.stderr, mcp-server.stderr, the editor's own logs), not the
      # media or the exports: only the copies made above.
      - name: Upload the judge's logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: judge-logs
          path: ${{ runner.temp }}/judge-logs
          if-no-files-found: ignore
          retention-days: 14
