name: Release

# Build the Windows installer + portable ZIP + checksums and attach them to a
# GitHub Release. Trigger by pushing a version tag (e.g. `git tag v0.1.0 &&
# git push --tags`) or run manually from the Actions tab.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # needed to create/upload the GitHub Release

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Reads GITHUB_REF. A tag must be v<semver> >= 0.2.0 and equal
      # apps/desktop/package.json's version; a branch ref passes. This guards
      # only tags cut from main: the inherited v0.1.x / v1.0.5 tags run their
      # own commit's workflow, which has no guard.
      - name: Check the release tag
        run: node scripts/release-guard.mjs

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Electron 42 has no install script: npm ci leaves its binary out, and the
      # first require('electron') downloads it and prints "Downloading Electron
      # binary..." in front of the path that the Electron's Node guard step
      # below reads. install.js downloads it here instead (checked against the
      # package's checksums.json; it does nothing when the binary is in place).
      - name: Install the Electron binary
        run: node node_modules/electron/install.js

      # The graphics add-on's pin is in sync with the lock, with every
      # platform's tarball total (the installer's size cap and progress). Tag
      # builds and dry runs alike.
      - name: Graphics add-on pin (gen-graphics-lock --check --require-sizes)
        run: node scripts/gen-graphics-lock.mjs --check --require-sizes

      # The rules of the packaging gate that electron-builder's afterPack hook
      # runs on the packed app below (scripts/check-no-remotion.mjs).
      - name: Packaging gate self-test (check-no-remotion)
        run: node scripts/check-no-remotion.mjs --self-test

      - name: Build core + mcp + renderer
        run: npm run build

      # Remotion's same-as refusal and the /proxy guard on Windows paths, before
      # anything is packaged: the load hook matches the files it rewrites by the
      # path of the loaded module (fileURLToPath of its URL), so a drive-letter,
      # junction or real-path difference here turns graphics off, and a rewrite
      # that misses leaves them open. One command per step (pwsh, see below).
      # Remotion is a devDependency (npm ci installs it), and this checkout is a
      # source checkout, so AIVE_REMOTION_ADDON points these steps at it.
      - name: Remotion guard in the built core (Node)
        env:
          AIVE_REMOTION_ADDON: ${{ github.workspace }}
        run: node packages/core/scripts/check-remotion-guard.mjs

      - name: Remotion guard in the built core (Electron's Node)
        env:
          ELECTRON_RUN_AS_NODE: "1"
          AIVE_REMOTION_ADDON: ${{ github.workspace }}
        run: '& (node -p "require(''electron'')") packages/core/scripts/check-remotion-guard.mjs'

      # strace and the network namespace are Linux-only and skip here; no
      # headless shell is cached, so the real renders (M5, M6b) skip and are
      # listed in the step summary. Nothing is downloaded.
      - name: Smoke — graphics browser network limits (no Chrome download)
        env:
          AIVE_REMOTION_ADDON: ${{ github.workspace }}
        run: npx tsx packages/core/scripts/smoke-chromeguard.ts

      - name: Smoke — graphic imports and bundle reads
        env:
          AIVE_REMOTION_ADDON: ${{ github.workspace }}
        run: npx tsx packages/core/scripts/smoke-graphicimports.ts

      # Pinned: the installer bundles the FFmpeg installed here (prepare-bundle
      # copies it in and still refuses a version not on TESTED_FFMPEG_VERSIONS).
      # Chocolatey's ffmpeg 9.0.2 is gyan.dev's essentials build.
      - name: Install FFmpeg (staging source; not shipped from here — prepare-bundle copies it in)
        run: choco install ffmpeg --version 9.0.2 -y --no-progress

      # The network-path gate on a real Windows host, before anything is
      # packaged (docs/RELEASING.md). Test servers are under .invalid, so a
      # leak reaches nobody. smoke-unc-e2e's step 7 runs only on Windows: it
      # shares temp folders on \\localhost with `net share` (the runner is an
      # administrator) and removes the shares at the end.
      # One command per step: the default shell here is pwsh, which does not
      # stop a multi-line run block when a native command fails.
      - name: I/O import gate self-test
        run: node scripts/check-io-imports.mjs --self-test

      - name: I/O import gate (core fs and child processes go through the network-path gate)
        run: node scripts/check-io-imports.mjs

      - name: Smoke — network paths (host keys, refusals, gatedfs, ffmpeg argv, graphic imports, approval store, trust folder)
        run: npx tsx packages/core/scripts/smoke-unc.ts

      - name: Smoke — network paths end to end (core process, traced; step 7 second share spelling on \\localhost)
        run: npx tsx packages/core/scripts/smoke-unc-e2e.ts

      # The add-on installer on fixtures from a loopback registry (no network):
      # its renames, name rules and recovery on a Windows disk, before anything
      # is packaged. Needs FFmpeg (installed above). The rows Windows can't run
      # print "skip (win32)" (docs/TESTING.md).
      - name: Smoke — graphics add-on installer (fixtures, loopback)
        run: npx tsx packages/core/scripts/smoke-addon.ts

      # The graphics add-on as a Windows user gets it (ADDON-PLAN R2), on every
      # run, tag pushes and workflow_dispatch dry runs alike: the real
      # installer downloads the pinned packages from registry.npmjs.org and the
      # pinned headless shell from Google into a data folder under RUNNER_TEMP
      # (outside the checkout and the packaging inputs), then a core renders one
      # graphic through it with AIVE_REMOTION_ADDON unset. Either failing fails
      # the job before anything is packaged. Never add a skip for it: no v* tag
      # until a dry run has passed it (docs/RELEASING.md).
      - name: Graphics add-on, live install and one render (registry.npmjs.org, Google)
        run: npx tsx packages/core/scripts/smoke-addon-real.ts --live

      - name: Stage bundled FFmpeg/whisper/YuNet/font resources
        run: npm run prepare:bundle --workspace zabsreel-desktop

      - name: Package Windows installer + portable ZIP (+ SHA256SUMS)
        # `--publish never` = build the installer AND emit the update feed
        # (latest.yml + .blockmap) into build/dist, but let the release step below
        # do the actual upload. Avoids electron-builder needing its own token here.
        # The afterPack hook (apps/desktop/build/afterpack.cjs) runs the
        # packaging gate on the packed app before the installer is made: no
        # Remotion package, add-on-only package, headless shell or core src/,
        # and the core's Remotion licence intact. A refusal fails this step.
        run: npm run dist --workspace zabsreel-desktop -- --publish never

      # --- Free code signing for open source (optional) -----------------------
      # Once approved by SignPath Foundation (https://signpath.org), uncomment and
      # configure the step below to sign the installer + exe automatically. Until
      # then the build ships unsigned (SmartScreen "More info → Run anyway").
      #
      # - name: Sign with SignPath (free OSS)
      #   uses: signpath/github-action-submit-signing-request@v1
      #   with:
      #     api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
      #     organization-id: ${{ secrets.SIGNPATH_ORG_ID }}
      #     project-slug: zabsreel
      #     signing-policy-slug: release-signing
      #     artifact-configuration-slug: installer
      #     github-artifact-id: ${{ ... }}
      #     wait-for-completion: true

      - name: Attach artifacts to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          # latest.yml + *.blockmap are REQUIRED for electron-updater to find and
          # differentially download the update — never cherry-pick just the .exe.
          files: |
            apps/desktop/build/dist/*.exe
            apps/desktop/build/dist/*.exe.blockmap
            apps/desktop/build/dist/latest.yml
            apps/desktop/build/dist/*.zip
            apps/desktop/build/dist/SHA256SUMS.txt
          # Must be PUBLISHED (not draft): electron-updater cannot see draft releases.
          draft: false
          generate_release_notes: true

      # On a manual run (no tag) just keep the build outputs as CI artifacts.
      - name: Upload build outputs (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: zabsreel-windows
          path: |
            apps/desktop/build/dist/*.exe
            apps/desktop/build/dist/*.zip
            apps/desktop/build/dist/SHA256SUMS.txt
