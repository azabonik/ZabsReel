name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-smoke:
    # Pinned, not ubuntu-latest: GitHub moves ubuntu-latest to a new Ubuntu release on its own schedule, and this
    # job is a required check on main. Moving to a new release is a deliberate PR (the FFmpeg matrix pins too).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Reads only: no old product name, upstream port or upstream data path
      # outside scripts/brand-allowlist.json. Needs no install, so it runs first.
      - name: Leftover-name gate
        run: |
          node scripts/check-brand.mjs --self-test
          node scripts/check-brand.mjs

      # The FFmpeg matrix's rerun logic (scripts/ci/matrix-job.sh, run-matrix.sh)
      # on stubs: no suite, FFmpeg or install runs, so it runs before them all.
      - name: Matrix rerun harness (stubs)
        run: timeout -k 10 180 bash scripts/ci/test/matrix-retry.sh

      # The FFmpeg matrix's flaky-report (scripts/ci/flaky-report.sh): which
      # tracking-issue calls it makes, on a stub gh. No network.
      - name: Flaky-report harness (stub gh)
        run: timeout -k 5 60 bash scripts/ci/test/flaky-report.sh

      # The clean-room runtime (packages/motion/cleanroom: runtime/, test/,
      # NOTES.md) is changed only by a clean-room session: its files must match
      # CLEANROOM.lock (the self-test proves a changed, added or deleted file
      # fails, on copies). Reads only, so it runs before the install too.
      - name: Clean-room lock gate
        run: |
          node scripts/check-cleanroom-lock.mjs --self-test
          node scripts/check-cleanroom-lock.mjs

      # The judge (judge/: black-box tests for the rewrite) must not change
      # without review: every file under judge/, scripts/check-judge-lock.mjs
      # and .github/workflows/judge.yml must match judge/JUDGE.lock (the
      # self-test proves a changed, added or deleted file, a link and a
      # __pycache__ file fail, on copies). The judge itself runs in judge.yml,
      # from a copy; this step makes deleting judge.yml or the gate fail CI
      # here too. Reads only, so it runs before the install.
      - name: Judge lock gate
        run: |
          node scripts/check-judge-lock.mjs --self-test
          node scripts/check-judge-lock.mjs

      # The release.yml tag guard otherwise runs only on a real tag push.
      - name: Release guard self-test
        run: node scripts/release-guard.mjs --self-test

      # smoke-opaque-base, smoke-security, smoke-jobs and smoke-safepath synthesize their own media with ffmpeg.
      # strace: smoke-unc row 16 traces FFmpeg on files that name a test server.
      - name: Install FFmpeg
        run: bash scripts/ci/apt-install.sh --no-install-recommends ffmpeg strace

      - name: Install dependencies
        run: npm ci

      # Electron 42 has no install script: npm ci leaves its binary out, and the
      # first require('electron') downloads it and prints "Downloading Electron
      # binary..." in front of the path that the Remotion guard step reads.
      # install.js downloads it here instead (checked against the package's
      # checksums.json; it does nothing when the binary is in place).
      - name: Install the Electron binary
        run: node node_modules/electron/install.js

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # The clean-room runtime's own unit tests (node --test through
      # sucrase/register, jsdom, React's development and production builds)
      # and its typecheck (its own tsconfig).
      - name: Clean-room runtime tests and typecheck
        run: npm run test:cleanroom

      # Ubuntu 24.04 restricts unprivileged user namespaces (AppArmor), so
      # Chromium's namespace sandbox cannot start there and it falls back to the
      # SUID helper, which an npm-installed Electron does not have set up. The
      # motion renderer runs only sandboxed, so on these default settings its
      # probe must refuse with sandbox-unavailable (as it does for a user on a
      # default Ubuntu 24.04), never run unsandboxed, crash or hang. It runs
      # before any step below allows the namespaces; the step summary says
      # which outcome this runner gave.
      - name: Motion renderer on Ubuntu's default settings (refuses, sandbox stays on)
        run: node packages/core/scripts/check-renderer-sandbox.mjs

      # The built core's Remotion guard under Node and under Electron's Node
      # (the app's core child): Remotion loads with the same-as refusal, and the
      # /proxy guard works. Remotion is a devDependency (npm ci installs it), and
      # a CI checkout is a source checkout, so AIVE_REMOTION_ADDON points the
      # graphics guard steps at it.
      - name: Remotion guard (built core, Node and Electron's Node)
        env:
          AIVE_REMOTION_ADDON: ${{ github.workspace }}
        run: |
          node packages/core/scripts/check-remotion-guard.mjs
          ELECTRON_RUN_AS_NODE=1 "$(node -p "require('electron')")" packages/core/scripts/check-remotion-guard.mjs

      # The media-free / self-synthesizing smoke subset (no model downloads).
      - name: Smoke — brand constants and the data-dir rule (temp HOME)
        run: npx tsx packages/core/scripts/smoke-brand.ts

      - name: Smoke — skill installer migrate (temp HOME)
        run: npx tsx packages/core/scripts/smoke-legacy-migrate.ts

      - name: Smoke — compositor plan (pure logic)
        run: npx tsx apps/desktop/scripts/smoke-composite.ts

      # Includes the desktop app's network-computer dialogs: a file picked on a
      # server not allowed yet asks once, and nothing is saved before Allow.
      - name: Smoke — save names, the native dialogs' rules and the network-computer dialogs (pure logic)
        run: npx tsx apps/desktop/scripts/smoke-savename.ts

      - name: Smoke — opaque base (render graph + pixel A/B)
        run: npx tsx packages/core/scripts/smoke-opaque-base.ts

      - name: Smoke — CLIP tokenizer (pure logic)
        run: npx tsx packages/core/scripts/smoke-clip-tokenizer.ts

      # /file, /frames and /peaks open only the path they checked: a ".." after a
      # linked folder, a link out of the data dir and a proxy or preview path
      # outside it answer 403 with nothing opened (fs and child_process traced).
      - name: Smoke — security (token auth + /file allowlist, real paths)
        run: npx tsx packages/core/scripts/smoke-security.ts

      # A core that gets SIGTERM while a client is in the middle of a request
      # closes that connection and exits at once (a kept-alive connection used
      # to keep it serving until its keep-alive timeout, about 5 s).
      - name: Smoke — core shutdown with a request in progress (core process, temp HOME)
        run: timeout -k 10 300 npx tsx packages/core/scripts/smoke-shutdown.ts

      - name: Smoke — jobs (background export, progress, cancel)
        run: npx tsx packages/core/scripts/smoke-jobs.ts

      - name: Smoke — safepath (traversal, protocols, filter allowlist)
        run: npx tsx packages/core/scripts/smoke-safepath.ts

      # The network gate as shipped (enforced): the approval store, its stamps
      # and the private trust folder.
      - name: Smoke — network paths (host keys, refusals, gatedfs, ffmpeg argv, graphic imports, approval store, trust folder)
        run: npx tsx packages/core/scripts/smoke-unc.ts

      # A real core process (the build above) with every fs and child_process
      # call traced and a logging FFmpeg stub: nothing names a test host, no
      # rpc or MCP tool can allow a server or read the stamp key, and a server
      # allowed (or revoked) in the app takes effect without a reload. Its
      # add_graphic rows run ZedMix's renderer, so it allows the user
      # namespaces as the motion steps below do.
      - name: Smoke — network paths end to end (core process, traced)
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          npx tsx packages/core/scripts/smoke-unc-e2e.ts

      - name: I/O import gate (core fs and child processes go through the network-path gate)
        run: |
          node scripts/check-io-imports.mjs --self-test
          node scripts/check-io-imports.mjs

      # FFmpeg's input-format allowlist: every media format on it still probes
      # and decodes one frame as without it (samples made with lavfi).
      - name: Smoke — media formats under the demuxer allowlist (FFmpeg, no network)
        run: npx tsx packages/core/scripts/smoke-demuxers.ts

      # The apt FFmpeg on the pinned ubuntu-24.04 runner is 6.1, a tested version (moving the pin to a new release changes it):
      # its version-specific checks (6.1's acrossfade dropped the end of a speed
      # ramp's audio) and the speed-ramp suite. The step prints the version first,
      # so a runner image with another FFmpeg shows in the log.
      - name: Smoke — FFmpeg version compatibility (synthesized media)
        run: |
          ffmpeg -version | head -1
          npx tsx packages/core/scripts/smoke-ffcompat.ts

      # FFmpeg 9.0's -progress out_time goes back when an audio stream ends
      # ahead of the video; runFfmpeg must not report a lower fraction. A stub
      # FFmpeg prints that sequence, so the runner's FFmpeg and load do not matter.
      - name: Smoke — FFmpeg progress never goes backwards (stub FFmpeg, no media)
        run: npx tsx packages/core/scripts/smoke-ffmpeg-progress.ts

      - name: Smoke — speed ramps (synthesized media)
        run: npx tsx packages/core/scripts/smoke-ramps.ts

      # The graphics browser's switches, its media downloads refused, Remotion's
      # same-as refusal (remotionload.ts's load hook, in memory: npm ci leaves
      # Remotion unpatched), the second layer (the /proxy guard, traced with
      # strace; muted renders) and the render.ts lint. Its real-Chrome parts
      # run only where the headless shell is cached; here they skip, and each
      # skip is written to this job's step summary.
      - name: Smoke — graphics browser network limits (no Chrome download)
        env:
          AIVE_REMOTION_ADDON: ${{ github.workspace }}
        run: npx tsx packages/core/scripts/smoke-chromeguard.ts

      # Graphic code may import only react and remotion, and webpack's file
      # system reads no file outside the scaffold and node_modules (real
      # bundles, no browser).
      - name: Smoke — graphic imports and bundle reads
        env:
          AIVE_REMOTION_ADDON: ${{ github.workspace }}
        run: npx tsx packages/core/scripts/smoke-graphicimports.ts

      # The graphics add-on's pin is in sync with the root lock (media-free):
      # closure, per-platform lists and their tarball totals, the add-on-only
      # list, the headless-shell table against Remotion's TESTED_VERSION.
      - name: Graphics add-on pin (gen-graphics-lock --check --require-sizes)
        run: node scripts/gen-graphics-lock.mjs --check --require-sizes

      # The packaging gate electron-builder's afterPack hook runs on every
      # packed app (scripts/check-no-remotion.mjs): its rules on fixture trees,
      # and this pin's shared packages (react, ws, semver@7.8.4, ...) allowed.
      - name: Packaging gate self-test (check-no-remotion)
        run: node scripts/check-no-remotion.mjs --self-test

      # The pin's walk on fixture locks and its drift guard, and the core's side
      # of the add-on: its states, add_graphic's 409 refusals and the UI signal,
      # the pinned browser everywhere Remotion could start one,
      # AIVE_REMOTION_ADDON only in a source checkout, and agent tools kept out
      # of <dataDir>/addons; then the installer the UI hosts run (fixture
      # tarballs and zips from a loopback registry): hashes before extraction,
      # the tar and zip readers, the install lock, cancel, activation and
      # recovery, reuse on update (Remotion stubbed, loopback ports 5030-5031).
      # smoke-addon-real.ts (the real closure from npm's cache) is not run here.
      - name: Smoke — graphics add-on (pin, core and installer)
        run: npx tsx packages/core/scripts/smoke-addon.ts

      # The packed Linux app for smoke-renderer's packed rows (R6 (c), R10):
      # electron-builder --dir with the Electron npm ci installed (nothing
      # downloaded); its afterPack hook runs the packaging gate
      # (check-no-remotion) on it.
      - name: Pack the Linux app (--dir, the installed Electron)
        id: pack_linux
        working-directory: apps/desktop
        run: npx electron-builder --linux --dir -c.electronDist=../../node_modules/electron/dist

      # Each motion smoke below (and the window guard smoke) runs whenever the
      # pack succeeded (if: on each), even when an earlier one failed, so every
      # one reports; any failed step still fails the job.
      # ZedMix's own motion renderer (packages/motion): the binary rule on
      # fixture trees, frames from hand-written pages through the offscreen
      # Electron renderer into FFmpeg, every network route refused (a private
      # network namespace, loopback listeners only), the limits and lifecycle,
      # the probe launch rows (the packed build's included); then the
      # runtime wired in: the clean-room lock, the vendored React's sha256, a
      # reproducible runtime build, the graphic's import check, and graphics
      # (the title template, seeking, delayRender, errors) through the renderer;
      # and the packed app rendering a graphic with library media and a font
      # (R10). AIVE_APP makes a missing packed app a failure, not a skip.
      # Chromium's sandbox and the namespace need unprivileged user namespaces,
      # which Ubuntu 24.04's AppArmor restricts by default. With CI=true a
      # missing namespace fails the network part (R3) instead of skipping it.
      - name: Smoke — motion renderer host and runtime (Electron offscreen, no network)
        if: ${{ !cancelled() && steps.pack_linux.outcome == 'success' }}
        env:
          AIVE_APP: ${{ github.workspace }}/apps/desktop/build/dist/linux-unpacked/zedmix-desktop
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          npx tsx packages/motion/scripts/smoke-renderer.ts

      # The motion renderer's library media and fonts (MOTION-PLAN D4): the
      # page's asset table (handles, never paths), frames equal to FFmpeg's own
      # decode, every cap of D4's table, an offline asset and a playlist-type
      # one refused with nothing they name touched (strace traces FFmpeg), no
      # file written outside the render's folder, library fonts, and a 60 s
      # 1080p video graphic within the caps. Fixtures are made with lavfi.
      - name: Smoke — motion renderer media and fonts (Electron offscreen, no network)
        if: ${{ !cancelled() && steps.pack_linux.outcome == 'success' }}
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          command -v strace >/dev/null || bash scripts/ci/apt-install.sh --no-install-recommends strace
          npx tsx packages/motion/scripts/smoke-motion-media.ts

      # The motion renderer captures a frame of library media only once the
      # requested source frame is painted (finding ZR-MEDIA-SETTLE): the worst
      # cases of the media parity set, five renders of each at once (the load
      # that made frames late), every frame byte-identical in all five and
      # showing FFmpeg's own decode of its source frame; and 300 first frames
      # per case the same way. Fixtures are made with lavfi.
      - name: Smoke — motion renderer settled media frames (Electron offscreen, no network)
        if: ${{ !cancelled() && steps.pack_linux.outcome == 'success' }}
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          npx tsx packages/motion/scripts/smoke-motion-settle.ts

      # The motion renderer's sound (MOTION-PLAN D4 E3, D-SPLIT): the cue
      # merge and its caps, a card's mix at the right times, rates and volumes
      # (measured from the files, never played), an overlay's .wav as one
      # linked audio clip in the export and an audioOnly render, the split
      # rule, and every failure (the mix's limit, a failed move, an offline
      # file) leaving baked/ as it was. Fixtures are made with lavfi.
      - name: Smoke — motion renderer audio (Electron offscreen, no network)
        if: ${{ !cancelled() && steps.pack_linux.outcome == 'success' }}
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          npx tsx packages/motion/scripts/smoke-motion-audio.ts

      # add_graphic switched over to ZedMix's own renderer (MOTION-PLAN D7):
      # the renderer setting (renderer.json, which only the UI hosts write; no
      # agent tool can), renderer-unavailable with its reason (no binary, no
      # display, no usable sandbox) in get_state and add_graphic's refusal,
      # get_state starting nothing, the probe at most once a minute, the title
      # template and the parity set through add_graphic, the refusals on the
      # add-on path, and the project library and an overlay's sound. The
      # Remotion add-on's rows need the pinned headless shell, so they skip
      # here (with a printed reason).
      - name: Smoke — motion renderer switch-over (Electron offscreen, no network)
        if: ${{ !cancelled() && steps.pack_linux.outcome == 'success' }}
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          npx tsx packages/motion/scripts/smoke-motion-switch.ts

      - name: Smoke — desktop window request guard and CSP (pure logic)
        if: ${{ !cancelled() && steps.pack_linux.outcome == 'success' }}
        run: npx tsx apps/desktop/scripts/smoke-netguard.ts

  # The packed Windows app renders (MOTION-PLAN D8 "Launch" row (c) on the build
  # ZedMix ships): electron-builder --dir with the Electron npm ci installed,
  # then smoke-renderer's R1 (the binary rule on fixture trees) and R10 on it:
  # the packed core's binary rule and probe, and one graphic with a library
  # video, an image and a font rendered by the packed app (real frames over fd
  # 3, media and font answers over fd 4), with no process left. One command
  # per step: the default shell here is pwsh, which does not stop a
  # multi-line run block when a native command fails.
  windows-packaged-render:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      # The checkout keeps the repository's bytes (pinned hashes: React's UMD
      # builds, CLEANROOM.lock), so no CRLF conversion.
      - name: No line-ending conversion
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Pinned to the build the installer bundles (release.yml), so this job
      # tests it: Chocolatey's ffmpeg 9.0.2 is gyan.dev's essentials build.
      - name: Install FFmpeg
        run: choco install ffmpeg --version 9.0.2 -y --no-progress

      # choco puts shims on PATH that start the real ffmpeg.exe as their child;
      # the core gets the real binaries, so R10's process row watches them.
      - name: Point the core at the real FFmpeg (not choco's shims)
        run: |
          $exe = Get-ChildItem C:\ProgramData\chocolatey\lib\ffmpeg -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          if (-not $exe) { throw "no ffmpeg.exe under C:\ProgramData\chocolatey\lib\ffmpeg" }
          $probe = Join-Path $exe.DirectoryName 'ffprobe.exe'
          if (-not (Test-Path -PathType Leaf $probe)) { throw "no ffprobe.exe next to $($exe.FullName)" }
          Add-Content -Path $env:GITHUB_ENV -Value "AIVE_FFMPEG=$($exe.FullName)"
          Add-Content -Path $env:GITHUB_ENV -Value "AIVE_FFPROBE=$probe"

      - name: Install dependencies
        run: npm ci

      # Electron 42 has no install script, so npm ci leaves
      # node_modules\electron\dist empty, and the pack step below uses that
      # folder as electronDist. install.js downloads the binary (checked
      # against the package's checksums.json).
      - name: Install the Electron binary
        run: node node_modules/electron/install.js

      - name: Build
        run: npm run build

      # The afterPack hook runs the packaging gate (check-no-remotion) on it.
      - name: Pack the Windows app (--dir, the installed Electron)
        working-directory: apps/desktop
        run: npx electron-builder --win --dir "-c.electronDist=${{ github.workspace }}\node_modules\electron\dist"

      - name: Smoke — the packed Windows app renders (frames over fd 3, media over fd 4, probe)
        env:
          AIVE_APP: ${{ github.workspace }}\apps\desktop\build\dist\win-unpacked\ZedMix.exe
        run: npx tsx packages/motion/scripts/smoke-renderer.ts --only=R1,R10
