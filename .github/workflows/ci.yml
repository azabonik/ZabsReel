name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Reads only: no old product name, upstream port or upstream data path
      # outside scripts/brand-allowlist.json. Needs no install, so it runs first.
      - name: Leftover-name gate
        run: |
          node scripts/check-brand.mjs --self-test
          node scripts/check-brand.mjs

      # The release.yml tag guard otherwise runs only on a real tag push.
      - name: Release guard self-test
        run: node scripts/release-guard.mjs --self-test

      # smoke-opaque-base, smoke-security, smoke-jobs and smoke-safepath synthesize their own media with ffmpeg.
      # strace: smoke-unc row 16 traces FFmpeg on files that name a test server.
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg strace

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # The media-free / self-synthesizing smoke subset (no model downloads).
      - name: Smoke — brand constants and the data-dir rule (temp HOME)
        run: npx tsx packages/core/scripts/smoke-brand.ts

      - name: Smoke — skill installer migrate (temp HOME)
        run: npx tsx packages/core/scripts/smoke-legacy-migrate.ts

      - name: Smoke — compositor plan (pure logic)
        run: npx tsx apps/desktop/scripts/smoke-composite.ts

      # Includes the desktop app's network-computer dialogs: a file picked on a
      # server not allowed yet asks once, and nothing is saved before Allow.
      - name: Smoke — save names, the native dialogs' rules and the network-computer dialogs (pure logic)
        run: npx tsx apps/desktop/scripts/smoke-savename.ts

      - name: Smoke — opaque base (render graph + pixel A/B)
        run: npx tsx packages/core/scripts/smoke-opaque-base.ts

      - name: Smoke — CLIP tokenizer (pure logic)
        run: npx tsx packages/core/scripts/smoke-clip-tokenizer.ts

      # /file, /frames and /peaks open only the path they checked: a ".." after a
      # linked folder, a link out of the data dir and a proxy or preview path
      # outside it answer 403 with nothing opened (fs and child_process traced).
      - name: Smoke — security (token auth + /file allowlist, real paths)
        run: npx tsx packages/core/scripts/smoke-security.ts

      - name: Smoke — jobs (background export, progress, cancel)
        run: npx tsx packages/core/scripts/smoke-jobs.ts

      - name: Smoke — safepath (traversal, protocols, filter allowlist)
        run: npx tsx packages/core/scripts/smoke-safepath.ts

      # The network gate as shipped (enforced): the approval store, its stamps
      # and the private trust folder.
      - name: Smoke — network paths (host keys, refusals, gatedfs, ffmpeg argv, graphic imports, approval store, trust folder)
        run: npx tsx packages/core/scripts/smoke-unc.ts

      # A real core process (the build above) with every fs and child_process
      # call traced and a logging FFmpeg stub: nothing names a test host, no
      # rpc or MCP tool can allow a server or read the stamp key, and a server
      # allowed (or revoked) in the app takes effect without a reload.
      - name: Smoke — network paths end to end (core process, traced)
        run: npx tsx packages/core/scripts/smoke-unc-e2e.ts

      - name: I/O import gate (core fs and child processes go through the network-path gate)
        run: |
          node scripts/check-io-imports.mjs --self-test
          node scripts/check-io-imports.mjs

      # FFmpeg's input-format allowlist: every media format on it still probes
      # and decodes one frame as without it (samples made with lavfi).
      - name: Smoke — media formats under the demuxer allowlist (FFmpeg, no network)
        run: npx tsx packages/core/scripts/smoke-demuxers.ts

      # The apt FFmpeg on ubuntu-latest is Ubuntu 24.04's 6.1, a tested version:
      # its version-specific checks (6.1's acrossfade dropped the end of a speed
      # ramp's audio) and the speed-ramp suite. The step prints the version first,
      # so a runner image with another FFmpeg shows in the log.
      - name: Smoke — FFmpeg version compatibility (synthesized media)
        run: |
          ffmpeg -version | head -1
          npx tsx packages/core/scripts/smoke-ffcompat.ts

      - name: Smoke — speed ramps (synthesized media)
        run: npx tsx packages/core/scripts/smoke-ramps.ts

      # The graphics browser's switches, its media downloads refused, Remotion's
      # same-as patch (applied by npm ci's postinstall) and the render.ts lint.
      # Its real-Chrome part runs only where the headless shell is cached.
      - name: Smoke — graphics browser network limits (no Chrome download)
        run: npx tsx packages/core/scripts/smoke-chromeguard.ts

      - name: Smoke — desktop window request guard and CSP (pure logic)
        run: npx tsx apps/desktop/scripts/smoke-netguard.ts
