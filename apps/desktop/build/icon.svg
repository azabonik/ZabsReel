<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!--
    SynthCut app icon: the UI's Logo glyph (rounded square + play triangle,
    src/icons.tsx) in the accent colour on the editor's dark surface.
    Edges sit on multiples of 16 so the 16/32/48 px renders stay sharp.
    Rendered to icon.ico / icon.png by scripts/make-icon.ts.
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#131419"/>
      <stop offset="1" stop-color="#0e0f13"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="224" height="224" rx="52" fill="url(#tile)"/>
  <rect x="17" y="17" width="222" height="222" rx="51" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="2"/>
  <rect x="56" y="56" width="144" height="144" rx="40" fill="none" stroke="#6c8cff" stroke-width="16"/>
  <path d="M110 96v64l56-32z" fill="#6c8cff" stroke="#6c8cff" stroke-width="8" stroke-linejoin="round"/>
</svg>
