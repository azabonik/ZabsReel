<!doctype html>
<!--
  The render page (MOTION-PLAN D2, D5). The core serves it, and every script
  it loads, from the render's zrmotion table; the renderer main adds the same
  Content-Security-Policy as a response header. The scripts, in order:
  guard.js (first, before anything else runs), React 18.3.1's UMD builds,
  loader.js (frames and the require table), zr-runtime.js (the clean-room
  runtime), host.js (the host adapter) and module.js (the graphic).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src zrmotion:; img-src zrmotion: data: blob:; media-src 'none'; font-src zrmotion:; style-src zrmotion: 'unsafe-inline'; connect-src 'none'; worker-src 'none'; child-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <style>
      html, body { margin: 0; padding: 0; overflow: hidden; background: transparent; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="guard.js"></script>
    <script src="react.production.min.js"></script>
    <script src="react-dom.production.min.js"></script>
    <script src="loader.js"></script>
    <script src="zr-runtime.js"></script>
    <script src="host.js"></script>
    <script src="module.js"></script>
  </body>
</html>
